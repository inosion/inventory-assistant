[package]
name = "inventory-assistant-web"
version.workspace = true
description = "Mobile capture UI (Leptos/wasm) for inventory-assistant"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
console_error_panic_hook = "0.1.7"
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }
js-sys = "0.3.107"
leptos = { version = "0.8.23", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = [
  "Blob", "CanvasRenderingContext2d", "Document", "Event", "File", "FileList", "FormData",
  "HtmlCanvasElement", "HtmlInputElement", "ImageBitmap", "KeyboardEvent", "Storage", "Url", "Window",
] }
